name: Backend Code Quality Pipeline

on:
  push:
    branches: [main, backend-dev]
  pull_request:
    branches: [main, backend-dev]

jobs:
  backend-quality:
    name: Backend Lint, Quality & Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            npx eslint "src/**/*.ts" --max-warnings=0
          else
            npx eslint "src/**/*.ts"
          fi

      - name: Code complexity check
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            npx eslint src --rule "complexity:[error,15]"
          else
            npx eslint src --rule "complexity:[warn,20]"
          fi

      - name: Dead code check
        run: npx ts-prune || true

      - name: Circular dependency check
        run: npx madge --circular src || true

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
